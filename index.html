<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QuoiManger">
  <title>QuoiManger</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#" data-action="home">Quoi<span>Manger</span></a>
    <span id="step-count" class="step-count" hidden></span>
    <button id="sync-pill" class="sync-pill" data-action="goto" data-view="prefs" hidden><span class="dot"></span><span data-i18n="household_pill">Foyer</span></button>
    <button id="lang-btn" class="lang-btn" data-action="lang" aria-label="Language"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><span>FR</span></button>
  </header>

  <main id="app"></main>

  <nav id="nav" class="nav" hidden>
      <button data-view="menu"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span><span data-i18n="nav_menu">Semaine</span></button>
      <button data-view="explore"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><span data-i18n="nav_recipes">Recettes</span></button>
      <button data-view="shop"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg><i id="cart-badge" class="badge" hidden></i></span><span data-i18n="nav_shop">Courses</span></button>
      <button data-view="prefs"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></span><span data-i18n="nav_profile">Profil</span></button>
    </nav>

  <footer id="wizard-bar" class="wizard-bar" hidden>
    <div class="progress"><div id="progress-fill"></div></div>
    <div class="wizard-actions">
      <button id="btn-back" class="btn ghost">Retour</button>
      <button id="btn-next" class="btn primary">Continuer</button>
    </div>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true"><div id="modal-body"></div></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ingredients-fr.js"></script>
  <script src="js/ingredients-zh.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/recipe-names.js"></script>
  <script src="js/recipes-extra.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/prices.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
